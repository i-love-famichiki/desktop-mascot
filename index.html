<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Desktop Mascot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage">
      <!-- 吹き出し -->
      <div id="bubble" class="hidden">
        <button id="bubble-minimize" class="bubble-button" type="button" title="小さくする" aria-label="小さくする">－</button>
        <button id="bubble-close" class="bubble-button" type="button" title="閉じる" aria-label="閉じる">×</button>
        <p id="bubble-text"></p>
        <!-- Google 検索を使った返事のときだけ、出典のリンクを並べる -->
        <p id="bubble-sources" hidden></p>
        <!-- 小さくしたときだけ出る。押すと元に戻る -->
        <button id="bubble-restore" type="button">返事を見る</button>
      </div>

      <!-- マスコット本体。assets/mascot.png を置くとその画像が使われ、
           無ければ下の CSS だけで描いたキャラにそのまま戻る -->
      <div id="mascot" title="クリックで話しかける / ドラッグで移動">
        <img
          id="mascot-img"
          src="assets/mascot.png"
          alt=""
          draggable="false"
          hidden
        />
        <div id="mascot-fallback">
          <svg id="mascot-svg" viewBox="0 0 200 160" role="img" aria-label="枝豆のマスコット">
            <defs>
              <!-- 左上から光が当たって見えるよう、明るい中心を左上に寄せる -->
              <radialGradient id="beanGrad" cx="0.38" cy="0.32" r="0.75">
                <stop offset="0" stop-color="#c9ef8a" />
                <stop offset="0.5" stop-color="#8fd14f" />
                <stop offset="1" stop-color="#5aa832" />
              </radialGradient>
            </defs>

            <!-- 接地した影。豆の底に触れる高さに置き、浮いて見えないようにする -->
            <ellipse class="ground" cx="104" cy="141" rx="70" ry="9" />

            <!-- 転がるときに回す外側の入れ物（影は回さない） -->
            <g class="roller">
            <!-- 豆1粒（少しだけ傾ける）。下側を少しへこませたそら豆形 -->
            <g transform="rotate(-10 100 80)">
              <path
                class="bean"
                d="M30 80 C26 40 70 18 110 22 C156 26 182 52 178 88 C174 122 140 138 104 132 C88 129 80 118 66 120 C44 124 32 108 30 80 Z"
              />
              <!-- へそ（豆がさやについていた跡） -->
              <path class="hilum" d="M78 116 Q92 125 108 124" />
              <!-- つや -->
              <ellipse class="gloss" cx="76" cy="50" rx="24" ry="11" transform="rotate(-18 76 50)" />
              <ellipse class="gloss small" cx="150" cy="60" rx="6" ry="4" />
            </g>
            </g>
          </svg>
        </div>
      </div>

      <!-- 入力欄 -->
      <div id="input-row" class="hidden">
        <!-- 文字数に合わせて高さが伸びる（renderer.js の resizeInput） -->
        <textarea
          id="input"
          rows="1"
          autocomplete="off"
          placeholder="話しかける…"
        ></textarea>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
